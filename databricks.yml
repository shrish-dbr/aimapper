bundle:
  name: aimapper

# Everything workspace-specific is a variable — nothing about any one workspace is
# committed. `python3 setup/install.py` sets them all (and saves them per app in a
# git-ignored file), so you normally never edit this file. See README → Install.
variables:
  app_name:
    description: App name (≤26 chars, lowercase letters, numbers, hyphens). Also prefixes the job, Genie space and role groups.
    default: aimapper
  catalog:
    description: Unity Catalog catalog that holds the app's schema.
  schema:
    description: Schema for the app's tables, volume and indexes.
    default: aimapper
  sql_warehouse_id:
    description: SQL warehouse the app, Genie space and sync job run on.
  serving_endpoint_name:
    description: Chat LLM serving endpoint used for mapping.
    default: databricks-claude-sonnet-4-5
  admins:
    description: Comma-separated emails that are always app admins (bootstrap).
    default: ""
  admin_group:
    description: Account group for the Admin role.
    default: aimapper-admins
  editor_group:
    description: Account group for the Editor role.
    default: aimapper-editors
  viewer_group:
    description: Account group for the Viewer role.
    default: aimapper-viewers
  vs_endpoint:
    description: Vector Search endpoint for both indexes (created by the installer; shared, not bundle-managed).
    default: aimapper-retrieval
  genie_space_file:
    description: Genie space definition generated by the installer from setup/templates/genie_space.template.json.
    default: .databricks/generated/aimapper.geniespace.json

workspace:
  # One deployment state per app name, so several installs (e.g. a test app next to
  # the real one) can live in the same workspace without clobbering each other.
  root_path: ~/.bundle/${bundle.name}/${var.app_name}

resources:
  apps:
    app:
      name: ${var.app_name}
      description: "Target-driven source-to-target SQL schema mapper with LLM attribute discovery and target-schema validation"
      source_code_path: ./
      config:
        command: ["npm", "run", "start"]
        env:
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql-warehouse
          - name: DATABRICKS_SERVING_ENDPOINT_NAME
            value_from: serving-endpoint
          - name: AIMAPPER_CATALOG
            value: ${var.catalog}
          - name: AIMAPPER_SCHEMA
            value: ${var.schema}
          - name: AIMAPPER_ADMINS
            value: ${var.admins}
          - name: AIMAPPER_ADMIN_GROUP
            value: ${var.admin_group}
          - name: AIMAPPER_EDITOR_GROUP
            value: ${var.editor_group}
          - name: AIMAPPER_VIEWER_GROUP
            value: ${var.viewer_group}
          - name: AIMAPPER_VS_ENDPOINT
            value: ${var.vs_endpoint}
          - name: AIMAPPER_VS_INDEX
            value: ${var.catalog}.${var.schema}.aimapper_retrieval_index
          - name: AIMAPPER_DOCS_INDEX
            value: ${var.catalog}.${var.schema}.aimapper_reference_index
          - name: AIMAPPER_GENIE_SPACE_ID
            value: ${resources.genie_spaces.assistant.id}
      # OBO scopes: everything runs on behalf of the signed-in user.
      user_api_scopes:
        - sql
        - serving.serving-endpoints
        - catalog.catalogs
        - catalog.schemas
        - catalog.tables
        - files              # reference PDFs in the reference_docs volume
        - dashboards.genie   # Ask Genie panel
        - apps               # "Apply group permissions" (Permissions API)
        - vector-search
        - model-serving
      # Resources the app's service principal is granted on deploy.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: serving-endpoint
          serving_endpoint:
            name: ${var.serving_endpoint_name}
            permission: CAN_QUERY
      permissions:
        - group_name: ${var.admin_group}
          level: CAN_MANAGE
        - group_name: ${var.editor_group}
          level: CAN_USE
        - group_name: ${var.viewer_group}
          level: CAN_USE

  genie_spaces:
    assistant:
      title: ${var.app_name}-assistant
      description: "Ask questions about AI Mapper runs, steps, feedback and the target schema."
      warehouse_id: ${var.sql_warehouse_id}
      file_path: ${var.genie_space_file}
      permissions:
        - group_name: ${var.admin_group}
          level: CAN_MANAGE
        - group_name: ${var.editor_group}
          level: CAN_RUN
        - group_name: ${var.viewer_group}
          level: CAN_RUN

  vector_search_indexes:
    # Example search: few-shot retrieval over approved examples + approved history.
    retrieval_index:
      name: ${var.catalog}.${var.schema}.aimapper_retrieval_index
      endpoint_name: ${var.vs_endpoint}
      primary_key: id
      index_type: DELTA_SYNC
      delta_sync_index_spec:
        source_table: ${var.catalog}.${var.schema}.aimapper_retrieval_corpus
        pipeline_type: TRIGGERED
        embedding_source_columns:
          - name: content
            embedding_model_endpoint_name: databricks-gte-large-en
        columns_to_sync: [id, kind, domain, project_id, target_table, source_signature, content, generated_sql]
    # Document search: passages parsed from the reference PDFs.
    reference_index:
      name: ${var.catalog}.${var.schema}.aimapper_reference_index
      endpoint_name: ${var.vs_endpoint}
      primary_key: chunk_id
      index_type: DELTA_SYNC
      delta_sync_index_spec:
        source_table: ${var.catalog}.${var.schema}.aimapper_reference_chunks
        pipeline_type: TRIGGERED
        embedding_source_columns:
          - name: embed_text
            embedding_model_endpoint_name: databricks-gte-large-en
        columns_to_sync: [chunk_id, source_system, file_name, file_path, chunk_index, page_start, page_end, heading, content, char_count, embed_text]

  jobs:
    # Hourly: rebuild the retrieval corpus and sync both indexes (Storage-Optimized
    # endpoints only support TRIGGERED sync).
    retrieval_sync:
      name: ${var.app_name}-retrieval-sync
      schedule:
        quartz_cron_expression: "0 0 * * * ?"
        timezone_id: UTC
        pause_status: UNPAUSED
      tasks:
        - task_key: rebuild_and_sync
          notebook_task:
            notebook_path: ./setup/retrieval_sync_notebook.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              index_name: ${var.catalog}.${var.schema}.aimapper_retrieval_index
              reference_index_name: ${var.catalog}.${var.schema}.aimapper_reference_index
      permissions:
        - group_name: ${var.admin_group}
          level: CAN_MANAGE_RUN

targets:
  default:
    default: true
    # Workspace host is NOT committed — it comes from your Databricks CLI auth
    # (`--profile`), keeping this repo workspace-agnostic.
