command: ['npm', 'run', 'start']
env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: DATABRICKS_SERVING_ENDPOINT_NAME
    valueFrom: serving-endpoint
  # Unity Catalog catalog/schema holding the app's tables (target_schema,
  # aimapper_conversion_runs, mapping_examples, aimapper_config).
  # app.yaml does not support ${var.*} substitution, so set these to YOUR values
  # before deploying. The plugin reads them via env at runtime; the catalog can
  # also be changed later in-app on the Config page (per-user, stored in a table).
  - name: AIMAPPER_CATALOG
    value: serverless_stable_12edvn_catalog
  - name: AIMAPPER_SCHEMA
    value: aimapper
  # Comma-separated emails that are ALWAYS admins (bootstrap for the approval
  # workflow). These can manage everyone else's role in-app (Admin tab). All
  # other signed-in users default to 'viewer' until an admin promotes them.
  # Set to your own admin email(s) before deploying.
  - name: AIMAPPER_ADMINS
    value: "shrish.chaturvedi@databricks.com"
  # Account groups that define the roles (setup/08_role_groups.py creates them).
  - name: AIMAPPER_ADMIN_GROUP
    value: "aimapper-admins"
  - name: AIMAPPER_EDITOR_GROUP
    value: "aimapper-editors"
  - name: AIMAPPER_VIEWER_GROUP
    value: "aimapper-viewers"
  # Vector Search for semantic few-shot retrieval over approved examples + history.
  # OPTIONAL — leave empty to use the built-in lexical retrieval (recency + column
  # overlap). Populate from `setup/create_vector_index.sh` output.
  # Reference-document grounding: Vector Search index over passages parsed from the
  # reference PDFs. OPTIONAL — leave empty to disable doc grounding. From
  # setup/create_reference_index.sh.
  - name: AIMAPPER_DOCS_INDEX
    value: "serverless_stable_12edvn_catalog.aimapper.aimapper_reference_index"
  - name: AIMAPPER_VS_ENDPOINT
    value: "aimapper-retrieval"
  - name: AIMAPPER_VS_INDEX
    value: "serverless_stable_12edvn_catalog.aimapper.aimapper_retrieval_index"
  # Genie Agent space ID for the "Ask Genie" panel on the Mapper page.
  # OPTIONAL — leave empty to hide the panel. Create a Genie Agent over the
  # aimapper tables and paste the space ID here.
  - name: AIMAPPER_GENIE_SPACE_ID
    value: "01f1e17575301772bec1d39f6875493c"
